<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' data: blob:; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action https:"
    >
    <meta name="theme-color" content="#000000">
    <title>New tab</title>
    <link rel="stylesheet" href="style.css">
    <script src="config.js" defer></script>
    <script src="renderer.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <canvas id="dither-background" aria-hidden="true"></canvas>
    <div class="ambient-scrim" aria-hidden="true"></div>

    <main class="dashboard">
      <section class="hero" aria-labelledby="clock">
        <div class="helium-mark" aria-hidden="true">
          <span>He</span>
          <small>2</small>
        </div>
        <time id="clock" class="clock">00:00</time>
        <p id="date" class="date">Monday, January 1</p>
      </section>

      <form id="search-form" class="search" role="search">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="m16.25 16.25 4 4"></path>
        </svg>
        <input
          id="search-input"
          name="q"
          type="text"
          inputmode="search"
          autocomplete="off"
          autofocus
          spellcheck="false"
          aria-label="Search the web or enter an address"
          placeholder="Search or enter an address"
        >
        <kbd>/</kbd>
      </form>

      <nav class="shortcuts" aria-label="Shortcuts">
        <a href="https://github.com/">GitHub</a>
        <a href="https://www.reddit.com/">Reddit</a>
        <a href="https://www.youtube.com/">YouTube</a>
        <a href="https://chatgpt.com/">ChatGPT</a>
      </nav>
    </main>

    <button id="next-wallpaper" class="next-wallpaper" type="button" aria-label="Show next wallpaper" title="Next wallpaper">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="m9 6 6 6-6 6"></path>
      </svg>
    </button>

    <button id="appearance-button" class="appearance-button" type="button" aria-label="Customize background" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 3a9 9 0 1 0 9 9c0-1.1-.9-2-2-2h-1.2a2 2 0 0 1-1.8-2.9l.55-1.1A2 2 0 0 0 14.75 3H12Z"></path>
        <circle cx="7.5" cy="11" r=".8"></circle>
        <circle cx="10" cy="7" r=".8"></circle>
        <circle cx="7.8" cy="15" r=".8"></circle>
      </svg>
    </button>

    <aside id="appearance-panel" class="appearance-panel" aria-label="Background settings" hidden>
      <div>
        <strong>Background</strong>
        <span>Images stay on this Mac.</span>
      </div>
      <label class="upload-button">
        Choose image
        <input id="wallpaper-input" type="file" accept="image/png,image/jpeg,image/webp" hidden>
      </label>
      <label class="upload-button">
        Choose folder
        <input id="wallpaper-folder-input" type="file" accept="image/png,image/jpeg,image/webp" webkitdirectory multiple hidden>
      </label>
      <button id="reset-wallpaper" class="secondary-button" type="button">Use dark background</button>
    </aside>

    <noscript>This new tab page needs JavaScript for its clock and background.</noscript>
  </body>
</html>
